<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>한·몽 단어 배틀 - 학생</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="player-page">
  <div class="arena-bg player-arena-bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main class="player-shell">
    <section id="joinView" class="player-card join-card">
      <div class="player-brand"><div class="player-flags"><span>🇰🇷</span><b>⚡ VS ⚡</b><span>🇲🇳</span></div><span>LIVE GAME</span><h1>한·몽 단어 배틀</h1><p>Солонгос · Монгол үгийн тэмцээн</p></div>
      <div class="student-game-intro">
        <span><b>1</b> PIN으로 입장</span>
        <span><b>2</b> 빠르게 정답 선택</span>
        <span><b>3</b> 점수·순위 경쟁</span>
      </div>
      <label class="field"><span>PIN</span><input id="pinInput" inputmode="numeric" maxlength="6" placeholder="6자리 PIN" /></label>
      <label class="field"><span>이름 / Нэр</span><input id="nameInput" maxlength="20" placeholder="이름을 입력하세요" /></label>
      <div class="avatar-section"><span class="field-label">캐릭터 선택</span><div id="avatarGrid" class="avatar-grid"></div></div>
      <button id="joinBtn" class="btn primary full">입장하기</button>
      <div id="joinError" class="error-text"></div>
    </section>

    <section id="waitingView" class="player-card hidden center-card"><div class="mini-flag-line">🇰🇷 <b>READY</b> 🇲🇳</div>
      <div id="myAvatar" class="big-avatar">🐻</div>
      <h2 id="waitingName">입장 완료!</h2>
      <p>선생님이 게임을 시작할 때까지 기다려 주세요.</p>
      <div class="waiting-pulse">● ● ●</div>
    </section>

    <section id="countdownView" class="player-card hidden center-card countdown-card"><div class="mini-flag-line">🇰🇷 ⚔ 🇲🇳</div>
      <div class="countdown-label">READY</div>
      <div id="playerCountdown" class="player-countdown">3</div>
    </section>

    <section id="quizView" class="player-quiz hidden">
      <div class="player-quiz-top">
        <span id="playerQuestionCounter">Q 1/10</span>
        <div class="mini-score"><span>내 점수</span><strong id="myScore">0</strong></div>
      </div>
      <div class="player-timer"><div id="playerTimerBar"></div><span id="playerTimerText">10.0</span></div>
      <div id="playerDirection" class="direction-badge"></div>
      <div id="playerPrompt" class="player-prompt"></div>
      <div id="answerGrid" class="answer-grid"></div>
      <div id="submitState" class="submit-state"></div>
    </section>

    <section id="resultView" class="player-card hidden center-card result-card">
      <div id="resultIcon" class="result-icon">✓</div>
      <h2 id="resultTitle">정답!</h2>
      <div id="resultAnswer" class="correct-answer"></div>
      <div id="resultPoints" class="points">+900 pt</div>
      <p>다음 문제를 기다려 주세요.</p>
    </section>

    <section id="finishView" class="player-card hidden center-card finish-card">
      <div class="finish-label">FINISH</div>
      <div id="finishAvatar" class="big-avatar">🐻</div>
      <h2 id="finishName">수고했어요!</h2>
      <div class="finish-score"><span>최종 점수</span><strong id="finishScore">0</strong></div>
      <div id="finishRank" class="finish-rank">1위</div>
      <p id="finishNote">교실 화면에서 최종 시상식을 확인하세요.</p>
    </section>
  </main>
  <script type="module" src="js/player.js"></script>
</body>
</html>
