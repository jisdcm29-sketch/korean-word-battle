<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06142e" />
  <title>종합 배틀 · 카드 매칭 교사 화면 · v1.2</title>
  <link rel="stylesheet" href="css/matching.css?v=1.2" />
  <link rel="stylesheet" href="css/combined-stage-ui.css?v=1.0" />
  <style>
    html,body{height:100%;min-height:100%;overflow:hidden}body{margin:0}.game-actions{text-align:center!important}
    .match-shell{width:100%;height:100dvh;margin:0;padding:8px;display:flex;flex-direction:column;gap:7px}
    .combined-stage-context{min-height:38px;padding:8px 12px;border-radius:12px;background:#071a3a;color:#e7f2ff;display:flex;justify-content:space-between;font-size:12px;font-weight:800}
    #hostView{flex:1;min-height:0;min-width:0;height:auto;padding:10px 12px 8px;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
    .combined-titlebar{flex:none;min-height:32px;margin-bottom:6px;border-radius:12px;display:flex;justify-content:center;align-items:center;gap:12px;background:linear-gradient(90deg,#0e397d,#402586,#0e397d);color:#ffe488;font-weight:1000;font-size:14px}
    #gameView:not(.hidden){flex:1;min-height:0;display:flex;flex-direction:column}
    .game-monitor-head{flex:none;min-height:38px;padding:0 115px 0 10px}
    .host-game-layout{flex:1;min-height:0;min-width:0;padding-top:8px;grid-template-columns:minmax(0,1.72fr) minmax(300px,.78fr);gap:12px}
    .host-stage,.rank-panel{min-height:0;height:100%;min-width:0;overflow:hidden}
    .host-stage{grid-template-rows:auto auto minmax(0,1fr) auto;padding:14px 18px}
    .host-vocab-strip{min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-content:center;padding:10px 8px;gap:12px}
    .vocab-pill{min-width:0;width:100%;min-height:76px;padding:12px 10px;font-size:clamp(20px,1.65vw,30px);overflow-wrap:anywhere;word-break:keep-all}
    .circle-timer{width:clamp(320px,44vh,430px);max-width:min(48vw,430px);padding:28px}
    .rank-panel{display:flex;flex-direction:column;padding:12px}
    .ranking-list{flex:1;min-height:0;overflow:auto;align-content:start;justify-content:flex-start}
    .game-actions{flex:none;margin:5px 0 0;min-height:32px}
    .game-actions .btn{min-height:32px;padding:5px 12px;font-size:12px}
    .fullscreen-btn{top:11px;right:13px;z-index:35}
    #roundResultView:not(.hidden){flex:1;min-height:0}
    body.combined-fullscreen #hostView{border:0;border-radius:0}
    @media(max-width:900px){html,body{overflow:auto}.match-shell{height:auto;min-height:100dvh}.host-game-layout{grid-template-columns:1fr}.host-stage{min-height:520px}.rank-panel{min-height:240px;display:flex}.host-vocab-strip{grid-template-columns:repeat(3,minmax(0,1fr))}.vocab-pill{min-height:58px;font-size:clamp(16px,3vw,23px)}.circle-timer{width:min(330px,42vh);max-width:72vw;padding:22px}}
    @media(max-height:700px) and (min-width:901px){.circle-timer{width:clamp(300px,39vh,370px);padding:24px}.vocab-pill{min-height:60px;padding:7px 9px;font-size:clamp(17px,1.4vw,25px)}}
  </style>
</head>
<body class="match-host-page">
  <div class="combined-stage-controls"><button id="endRoomBtn" type="button">🏠 종합게임 종료</button><button id="fullscreenBtn" type="button" class="fullscreen-btn">⛶ 전체 화면</button></div>
  <div class="match-bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main class="match-shell">
    <div class="combined-stage-context"><span>종합 배틀 · ROUND 2 · 카드 매칭</span><span>🇰🇷 · 🇲🇳</span></div>
    <section id="hostView" class="match-panel host-panel">
      <div class="combined-titlebar"><span>🇰🇷</span><strong>LIVE CARD MATCHING</strong><span>🇲🇳</span></div>
      <div id="gameView" class="host-view">
        <header class="game-monitor-head"><div><span class="live-dot">LIVE</span><strong id="hostRoundLabel">ROUND 1/3</strong><span id="blindBadge" class="blind-badge hidden">마지막 30% · 순위 비공개</span></div><div class="monitor-audio"><span id="musicMode">🎵 BATTLE</span><button id="gameBgmBtn" type="button">BGM ON</button><button id="gameSfxBtn" type="button">SFX ON</button></div></header>
        <div id="countdownOverlay" class="countdown-overlay hidden"><span>READY</span><b id="countdownText">3</b></div>
        <div class="host-game-layout">
          <section class="host-stage">
            <div class="round-vocab-head"><span>이번 판 어휘</span><strong id="hostMatchedSummary">0/6쌍</strong></div>
            <div id="hostVocabStrip" class="host-vocab-strip"></div>
            <div class="host-timer-space"><div id="hostCircleTimer" class="circle-timer"><div class="circle-inner"><strong id="hostTimerText">45.0</strong><span>SECONDS</span></div></div></div>
            <div class="stage-note">학생 화면에서 한국어 카드와 몽골어 카드를 짝지어 맞춥니다.</div>
          </section>
          <aside class="rank-panel combined-stage-ranking">
            <div class="rank-head"><h3>🏆 종합 실시간 순위</h3><span id="progressText">누적 점수</span></div>
            <div id="rankingList" class="ranking-list combined-score-list"></div>
            <div id="rankBlindCover" class="rank-blind-cover hidden"><div>?</div><strong>최종 30% 승부</strong><span>점수와 순위는 게임 종료 후 공개됩니다.</span></div>
          </aside>
        </div>
      </div>
      <div id="roundResultView" class="host-view round-result-view hidden">
        <p class="eyebrow">ROUND COMPLETE</p><h2 id="roundResultTitle">1판 종료</h2><div id="roundResultTimer" class="next-round-count">다음 판 3</div><div id="roundTop3" class="round-top3"></div>
      </div>
    </section>
  </main>
  <script type="module" src="js/combined-stage-matching.js?v=1.3"></script>
</body>
</html>
