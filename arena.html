<!doctype html>
<html lang="ko" style="visibility:hidden">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07152f" />
  <title>한·몽 한국어 게임 아레나</title>
  <link rel="stylesheet" href="css/platform.css?v=2.8" />
</head>
<body>
  <div class="platform-bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="platform-shell">
    <header class="platform-hero">
      <div class="flags"><span>KR</span><b>⚡</b><span>MN</span></div>
      <p class="eyebrow">KOREAN · MONGOLIAN GAME PLATFORM</p>
      <h1>한국어 게임 아레나</h1>
    </header>

    <section id="classView" class="platform-panel class-panel hidden">
      <div class="compact-head"><h2>수업 반을 선택하세요</h2></div>
      <p class="source-intro">주간 점수를 누적하려면 반을 선택하세요. 반 이름은 이 화면에서 직접 등록할 수 있습니다.</p>
      <div id="classList" class="class-list"></div>
      <div class="class-create-row">
        <input id="classNameInput" type="text" maxlength="40" placeholder="예: 서울대 1A 오전반" autocomplete="off" />
        <button id="addClassBtn" type="button">반 추가</button>
      </div>
      <p id="classMessage" class="class-message" aria-live="polite"></p>
      <div class="class-skip-wrap">
        <button id="skipClassBtn" class="class-skip-btn" type="button">건너뛰기 — 오늘 게임만 하기</button>
        <small>건너뛰면 당일 게임과 당일 시상만 사용하며 주간 누적에는 포함되지 않습니다.</small>
      </div>
    </section>

    <section id="sourceView" class="platform-panel source-panel hidden">
      <div class="selected-class-bar"><span id="selectedClassLabel"></span><div class="selected-class-actions"><button class="weekly-ranking-btn" type="button">이번 주 순위</button><button class="weekly-award-btn" type="button">주간 시상</button><button class="student-manage-btn" type="button">학생 관리</button><button id="changeClassBtn" type="button">반 변경</button></div></div>
      <div class="compact-head"><h2>먼저 사용할 자료를 선택하세요</h2></div>
      <p class="source-intro">한 번 선택하면 게임을 바꿀 때 다시 고르지 않아도 됩니다.</p>
      <div class="source-card-grid">
        <button class="source-card" type="button" data-source="preliminary"><span>🔤</span><strong>예비편</strong><small>어휘 40 · 자모음 학습</small></button>
        <button class="source-card" type="button" data-source="snu"><span>📘</span><strong>서울대 한국어</strong><small>1A~4B</small></button>
        <button class="source-card" type="button" data-source="sejong"><span>📗</span><strong>세종한국어(개정판)</strong><small>1A~4B</small></button>
        <button class="source-card" type="button" data-source="topik1"><span>📙</span><strong>TOPIK 1 연어 표현</strong><small>기존 자료 유지</small></button>
      </div>
    </section>
    <section id="gameView" class="platform-panel platform-main-panel hidden">
      <div class="selected-class-bar"><span id="selectedClassLabelGame"></span><div class="selected-class-actions"><button class="weekly-ranking-btn" type="button">이번 주 순위</button><button class="weekly-award-btn" type="button">주간 시상</button><button class="student-manage-btn" type="button">학생 관리</button><button id="changeClassBtnGame" type="button">반 변경</button></div></div>
      <div class="selected-source-bar"><span>선택 자료 <strong id="selectedSourceName"></strong></span><button id="changeSourceBtn" type="button">자료 종류 변경</button></div>
      <div class="compact-head"><h2>게임 선택</h2></div>
      <div id="gameGrid" class="game-grid">
        <button class="game-card game-word active" type="button" data-game="word"><span class="game-icon">⚡</span><strong>어휘 배틀</strong></button>
        <button class="game-card game-sentence" type="button" data-game="sentence"><span class="game-icon">🧩</span><strong>문장 배틀</strong></button>
        <button class="game-card game-matching" type="button" data-game="matching"><span class="game-icon">🃏</span><strong>카드 매칭</strong></button>
        <button class="game-card game-memory" type="button" data-game="memory"><span class="game-icon">🧠</span><strong>기억력 배틀</strong></button>
        <button class="game-card game-search" type="button" data-game="search"><span class="game-icon">🔎</span><strong>단어 찾기 배틀</strong></button>
        <button class="game-card game-combined combined" type="button" data-game="combined"><span class="game-icon">🏆</span><strong>종합 배틀</strong></button>
      </div>
      <div class="setup-divider"></div>
      <div id="selectionLaunchRow" class="selection-launch-row">
        <div id="selectionArea" class="selection-area">
          <div class="compact-head selection-head"><h2>교재 · 단원</h2></div>
          <p id="selectionGuide" class="visually-hidden">어휘 배틀에서 사용할 자료를 선택하세요.</p>
          <div class="selection-grid">
            <label id="platformBookField" class="field"><span>교재</span><select id="platformBook"></select></label>
            <label id="platformLessonField" class="field"><span>과</span><select id="platformLesson"></select></label>
          </div>
          <div id="selectionSummary" class="visually-hidden"></div>
        </div>
        <button id="launchBtn" class="launch-btn" type="button"><span id="launchTitle">어휘 배틀 설정으로 이동</span><b>→</b></button>
      </div>
    </section>
  </main>
  <script type="module" src="js/arena-access.js?v=1.4"></script>
  <script type="module" src="js/platform.js?v=2.2"></script>
  <script type="module" src="js/student-manager-ui.js?v=1.0"></script>
  <script type="module" src="js/weekly-ranking-ui.js?v=1.0"></script>
  <script type="module" src="js/weekly-awards-ui.js?v=1.1"></script>

  <script>/* KWB_OFFLINE_SW_V1 */if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body>
</html>
