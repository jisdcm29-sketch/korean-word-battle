<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08162f" />
  <title>종합 배틀 · 문장 배틀 교사 화면</title>
  <link rel="stylesheet" href="sentence-battle-sample/css/sentence-sample.css?v=3.0" />
  <style>html,body{min-height:100%}body{margin:0}</style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div id="fireworksLayer" class="fireworks-layer" aria-hidden="true"></div>
  <div id="correctToast" class="correct-toast hidden" aria-live="polite"></div>
  <main class="app-shell">
    <section id="gameView" class="view game-view">
      <header class="monitor-header compact">
        <div class="game-meta"><span id="questionLabel">Q 1/6</span><span>참가 <b id="playerCount">0</b>명</span></div>
        <div class="teacher-controls">
          <button id="gameHomeBtn" class="control-btn" type="button">🏠 종합게임 종료</button>
          <button id="fullscreenBtn" class="control-btn" type="button">⛶ 전체화면</button>
          <div class="volume-box"><button id="soundToggle" class="sound-toggle" type="button">🔊</button><input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" step="5" value="75" /><b id="volumeLabel" class="volume-label">75%</b></div>
        </div>
      </header>
      <div class="arena-layout">
        <section class="teacher-stage">
          <div id="playingStage" class="playing-stage">
            <div class="round-kicker">ROUND <span id="roundNumber">1</span></div>
            <div class="prompt-card-wrap" aria-label="현재 문제의 제시 카드"><div id="promptCards" class="prompt-cards"></div></div>
            <div class="timer-space"><div id="circleTimer" class="circle-timer" style="--progress:100%;--timer-color:#37d8ff" aria-label="남은 시간"><div class="circle-timer-inner"><span id="bigTimer" class="big-timer">20.0</span><small>초</small></div></div></div>
            <div class="submit-status"><span>제출</span><b id="submittedCount">0</b><em>/</em><strong id="submittedTotal">0</strong></div>
          </div>
          <div id="revealStage" class="reveal-stage hidden">
            <div class="answer-label">정답</div>
            <div id="revealedSentence" class="revealed-sentence">정답 문장</div>
            <div id="variantNote" class="variant-note hidden">다른 자연스러운 어순도 정답</div>
            <div class="reveal-countdown"><span>다음 문제까지</span><b id="revealTimer">2.5</b></div>
          </div>
        </section>
        <aside id="rankPanel" class="rank-panel">
          <div class="rank-head"><span id="rankTitle">🏆 실시간 순위</span><small id="rankSubtitle">동시 문장 배틀</small></div>
          <div id="rankList" class="rank-list"></div>
          <div id="rankBlindMessage" class="rank-blind-message hidden"><div class="rank-lock">🔒</div><strong>순위 비공개</strong><span>마지막 30% 문항입니다.</span><small>최종 결과에서 공개됩니다.</small></div>
        </aside>
      </div>
      <div id="countdown" class="countdown hidden"><span id="countdownText">3</span></div>
    </section>
  </main>
  <script type="module" src="js/combined-stage-sentence.js?v=1.0"></script>
</body>
</html>
