<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07152f" />
  <title>한·몽 한국어 게임 아레나</title>
  <link rel="stylesheet" href="css/platform.css?v=2.0" />
</head>
<body>
  <div class="platform-bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="platform-shell">
    <header class="platform-hero">
      <div class="flags"><span>KR</span><b>⚡</b><span>MN</span></div>
      <p class="eyebrow">KOREAN · MONGOLIAN GAME PLATFORM</p>
      <h1>한국어 게임 아레나</h1>
    </header>

    <section class="platform-panel platform-main-panel">
      <div class="compact-head"><h2>게임 선택</h2></div>

      <div id="gameGrid" class="game-grid">
        <button class="game-card game-word active" type="button" data-game="word">
          <span class="game-icon">⚡</span><strong>어휘 배틀</strong>
        </button>
        <button class="game-card game-sentence" type="button" data-game="sentence">
          <span class="game-icon">🧩</span><strong>문장 배틀</strong>
        </button>
        <button class="game-card game-matching" type="button" data-game="matching">
          <span class="game-icon">🃏</span><strong>카드 매칭</strong>
        </button>
        <button class="game-card game-combined combined" type="button" data-game="combined">
          <span class="game-icon">🏆</span><strong>종합 배틀</strong>
        </button>
      </div>

      <div class="setup-divider"></div>

      <div class="selection-launch-row">
        <div class="selection-area">
          <div class="compact-head selection-head"><h2>교재 · 단원</h2></div>
          <p id="selectionGuide" class="visually-hidden">어휘 배틀에서 사용할 자료를 선택하세요.</p>
          <div class="selection-grid">
            <label class="field"><span>자료 / 교재</span><select id="platformSource"></select></label>
            <label id="platformBookField" class="field"><span>교재</span><select id="platformBook"></select></label>
            <label id="platformLessonField" class="field"><span>과</span><select id="platformLesson"></select></label>
          </div>
          <div id="selectionSummary" class="visually-hidden"></div>
        </div>

        <button id="launchBtn" class="launch-btn" type="button">
          <span id="launchTitle">어휘 배틀 설정으로 이동</span><b>→</b>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="js/platform.js?v=1.5"></script>
</body>
</html>
