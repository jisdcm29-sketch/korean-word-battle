<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08162f" />
  <title>문장 배틀 · 학생</title>
  <script>if(new URLSearchParams(location.search).get("preview")==="1")document.documentElement.classList.add("desktop-phone-preview");</script>
  <link rel="stylesheet" href="css/sentence-player.css?v=3.2-wait" />
  <link rel="stylesheet" href="../css/standalone-ui-sync-v2.css?v=2.0" />
  <link rel="stylesheet" href="../css/student-entry.css?v=entry-20261012" />
</head>
<body class="kga-entry-active">
  <main class="phone-shell">
    <section id="joinView" class="screen join-screen kga-entry">
      <div class="kga-brand"><div class="kga-flags"><span>🇰🇷</span><b>⚡ VS ⚡</b><span>🇲🇳</span></div><span class="kga-live">LIVE GAME</span><h1>문장 배틀</h1><p>Солонгос өгүүлбэр бүтээх тоглоом</p></div>
      <div class="kga-steps"><span><b>1</b> PIN으로 입장</span><span><b>2</b> 문제 풀기</span><span><b>3</b> 점수·순위 경쟁</span></div>
      <label class="kga-field"><span>PIN</span><input id="pinInput" inputmode="numeric" maxlength="6" placeholder="6자리 PIN" /></label>
      <label class="kga-field"><span>전화번호 또는 이름 / Утас эсвэл нэр</span><input id="nameInput" maxlength="60" placeholder="전화번호 또는 이름을 입력하세요" /></label>
      <div class="kga-avatar-section"><span class="kga-avatar-label">캐릭터 선택</span><div id="avatarGrid"></div></div>
      <button id="joinBtn" type="button">입장하기</button><div id="joinMessage" class="kga-error" role="status"></div>
    </section>

    <section id="waitView" class="screen wait-screen hidden">
      <div class="wait-icon" id="myAvatar">🙂</div><h2 id="waitName">입장 확인 중...</h2><p>선생님이 게임을 시작할 때까지 기다려 주세요.</p><div class="wait-pulse" aria-hidden="true">● ● ●</div>
    </section>

    <section id="countdownView" class="screen countdown-screen hidden"><p>READY</p><div id="studentCountdown" class="student-countdown">3</div></section>

    <section id="playView" class="screen play-screen hidden">
      <header class="play-head"><div><b id="studentQuestion">Q 1/6</b><span>점수 <strong id="studentScore">0</strong></span></div><div id="studentTimer" class="student-timer">20.0</div></header>
      <div class="mobile-timer-track"><div id="studentTimerBar" class="mobile-timer-bar"></div></div>
      <div class="answer-wrap"><span>내 문장</span><div id="studentAnswer" class="student-answer empty">카드를 순서대로 눌러 주세요</div></div>
      <div id="studentCards" class="student-cards"></div>
      <div id="submitState" class="submit-state"></div>
      <div class="student-controls"><button id="undoBtn" type="button">↶ 뒤로</button><button id="resetBtn" type="button">↺ 다시</button><button id="submitBtn" class="submit-btn" type="button" disabled>제출 ⚡</button></div>
    </section>

    <section id="resultView" class="screen result-screen hidden">
      <span class="result-label">정답</span><div id="studentReveal" class="student-reveal"></div><div id="myRoundResult" class="my-round-result"></div><p>잠시 후 다음 문장이 시작됩니다.</p>
    </section>

    <section id="studentFinalView" class="screen final-screen hidden">
      <div class="trophy">🏆</div><p class="eyebrow">BATTLE COMPLETE</p><h2>게임 종료</h2><div class="my-final"><span>내 점수</span><b id="myFinalScore">0</b><em id="myFinalRank">-위</em></div><div id="studentFinalRanking" class="student-final-ranking"></div><button id="leaveBtn" class="primary-btn" type="button">처음으로</button>
    </section>

    <section id="closedView" class="screen closed-screen hidden"><div>🏠</div><h2>게임방이 종료되었습니다.</h2><button id="closedHomeBtn" class="primary-btn" type="button">처음으로</button></section>
  </main>
  <script type="module" src="js/sentence-player.js?v=entry-20261013-wait"></script>
  <script src="../js/player-resume-helper.js?v=3.1"></script>
  <script src="../js/student-entry-ui.js?v=entry-20261012"></script>
</body>
</html>
